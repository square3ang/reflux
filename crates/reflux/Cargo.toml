[package]
name = "reflux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reflux-markdown.workspace = true
reflux-model.workspace = true
reflux-net.workspace = true
reflux-store.workspace = true
reflux-voice.workspace = true
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
fastrand = "2"
# Firefox's CTAP2 stack: USB security keys on Linux (hidraw + libudev), Windows and macOS.
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"] }
base64 = "0.22"
sha2 = "0.10"
url.workspace = true
# WebP and GIF from the media proxy (Rune decodes PNG and JPEG itself); png for the emoji spritesheet.
image = { version = "0.25", default-features = false, features = ["webp", "gif", "png", "jpeg"] }
# Desktop notifications: org.freedesktop.Notifications on Linux, NSUserNotification on macOS, toasts on Windows.
notify-rust = "4"
# UI sounds (assets/media/sounds); cpal is already in the tree through other crates.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Unity LauncherEntry (dock badge / urgency); notify-rust already pulls zbus 5.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
