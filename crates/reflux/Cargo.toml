[package]
name = "reflux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, features = ["native-file-dialog", "svg"] }
rune-kit.workspace = true
memmap2 = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reflux-markdown.workspace = true
reflux-model.workspace = true
reflux-net.workspace = true
reflux-store.workspace = true
reflux-voice.workspace = true
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }
dirs = "6"
# Reads the official desktop app's store for "Import session from Fluxer desktop".
rusqlite = { version = "0.37", features = ["bundled"] }
fastrand = "2"
# Firefox's CTAP2 stack: USB security keys on Linux (hidraw + libudev), Windows and macOS.
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"] }
serde_cbor = "0.11"
base64 = "0.22"
sha2 = "0.10"
icu_normalizer = "2"
url.workspace = true
# WebP and GIF from the media proxy (Rune decodes PNG and JPEG itself); png for the emoji spritesheet.
image = { version = "0.25", default-features = false, features = ["webp", "gif", "png", "jpeg"] }
# Desktop notifications: org.freedesktop.Notifications on Linux, NSUserNotification on macOS, toasts on Windows.
notify-rust = "4"
# UI sounds (assets/media/sounds); cpal is already in the tree through other crates.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis", "wav", "mp4", "symphonia-aac"] }
# Code block highlighting: bundled Sublime grammars on pure-Rust regexes (no onig).
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# Session tokens in the OS keyring (Secret Service over zbus, Keychain, Credential Manager).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
# The authenticator app setup QR code.
qrcode = { version = "0.14", default-features = false }
spellbook = "0.4"
whatlang = "0.18"
jiff = "0.2"
regex = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts", "background"] }
# Unity LauncherEntry (dock badge / urgency); notify-rust already pulls zbus 5.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# System idle time on Wayland (ext-idle-notify-v1), and file drops on winit's own connection
# (`system`, which winit turns on anyway); both already come with Rune, as does libc.
wayland-client = { version = "0.31", features = ["system"] }
libc = "0.2"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# X11 global shortcuts: the RECORD extension (x11rb is already in the tree through Rune).
x11rb = { version = "0.13", features = ["record"] }
# Video attachment playback and camera capture (GStreamer playbin / v4l2src into appsinks).
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }
gstreamer-video = { version = "0.24", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_LibraryLoader"] }
# authenticator 0.5's Windows HID transport passes a std `RawHandle` where winapi wants its own
# `c_void`; winapi's `std` feature makes them the same type (it doesn't compile otherwise).
winapi = { version = "0.3", features = ["std"] }
# The taskbar overlay badge (ITaskbarList3) and passkeys (webauthn.dll); already in the tree.
# Media Foundation (`mf.rs`): inline video / audio attachments and gifv.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Networking_WindowsWebServices", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock badge label; the versions Rune already uses.
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSString", "NSThread"] }
# Camera capture (`camera/av.rs`): AVFoundation through the objc2 0.6 crates Rune's video uses.
objc2 = "0.6"
objc2-foundation-03 = { package = "objc2-foundation", version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSValue"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBlockBuffer", "CMSampleBuffer", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase"] }
# ScreenCaptureKit audio (`audio_share/macos.rs`): system mix for a display share.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCStream", "SCShareableContent", "objc2-core-media", "objc2-core-foundation", "objc2-core-graphics", "block2", "dispatch2", "libc"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }

[features]
# Needs the GStreamer 1.x runtime (and -dev headers to build); `--no-default-features` drops it,
# and attachments fall back to "Open in browser" and the camera is unavailable.
# `voice` builds WebRTC (LiveKit + libwebrtc, the slowest dependency); without it `voice-webrtc`
# is off and calls / screen share / camera are unavailable — `scripts/fast-build.sh` for UI work.
default = ["gst", "voice"]
gst = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
voice = ["voice-webrtc"]
voice-webrtc = ["reflux-voice/webrtc"]
