[package]
name = "reflux-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livekit = { workspace = true, optional = true }
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# Our own audio I/O: mic capture into a NativeAudioSource and the remote mix out to the speakers.
cpal = "0.18"
# RNNoise in pure Rust: noise suppression on the mic path.
nnnoiseless = { version = "0.5", default-features = false }
# DeepFilterNet3 (tract inference, the model bundled). Not on crates.io past 0.2, so the release tag.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }

# The PipeWire screen capture portal talks GDBus, which needs a running GLib main loop.
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { workspace = true, features = ["glib-main-loop"], optional = true }
# The system's real sinks/sources and their streams. cpal's only Linux host is ALSA, which sees
# raw PCM plugins; PipeWire/PulseAudio devices live on the PulseAudio protocol instead.
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[features]
# The real LiveKit implementation, and with it libwebrtc (the slowest dependency to build).
# `--no-default-features` builds `src/stub.rs` instead: the app compiles for UI work without
# libwebrtc, and calls / screen share / camera are unavailable.
default = ["webrtc"]
webrtc = ["dep:livekit", "dep:deep_filter", "dep:ndarray"]

[dev-dependencies]
log = "0.4"
# Already in the tree (rustls): an independent PBKDF2 + AES-GCM for tests/e2ee.rs.
ring = "0.17"
