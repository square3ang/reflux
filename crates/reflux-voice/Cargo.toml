[package]
name = "reflux-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livekit.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# Our own audio I/O: mic capture into a NativeAudioSource and the remote mix out to the speakers.
cpal = "0.18"
# RNNoise in pure Rust: noise suppression on the mic path.
nnnoiseless = { version = "0.5", default-features = false }

# The PipeWire screen capture portal talks GDBus, which needs a running GLib main loop.
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { workspace = true, features = ["glib-main-loop"] }

[dev-dependencies]
log = "0.4"
