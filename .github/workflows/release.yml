# A `v*` tag builds the Linux AppImage, the Windows setup and the macOS disk image and publishes
# them as a GitHub release, the feed `desktop::updater` reads (GitHub adds each asset's SHA-256).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  REFLUX_UPDATE_FEED: https://api.github.com/repos/${{ github.repository }}/releases/latest

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest glibc GitHub still hosts, so the AppImage runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Packages
        run: |
          sudo apt-get update
          # The runner image's libunwind-14-dev conflicts with libgstreamer1.0-dev's libunwind-dev.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y pkg-config clang libglib2.0-dev libudev-dev libdbus-1-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav libva-dev libdrm-dev libgbm-dev libx11-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxext-dev libwayland-dev libxkbcommon-dev file desktop-file-utils
      - run: cargo build --release --locked -p reflux
      - run: sh packaging/linux/appimage.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Reflux-*.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p reflux
      - name: Setup
        shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp target/release/reflux.exe dist/
          cp -R assets/fonts dist/fonts
          command -v makensis || choco install nsis -y
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -DVERSION=$v -DSRC="$(cygpath -w "$PWD/dist")" -DOUT="$(cygpath -w "$PWD/Reflux-$v-x86_64-setup.exe")" packaging/windows/reflux.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Reflux-*-setup.exe

  macos:
    needs: version
    # Apple silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p reflux
      - run: sh packaging/macos/bundle.sh ${{ needs.version.outputs.version }} Reflux-${{ needs.version.outputs.version }}-aarch64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Reflux-*.dmg

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Reflux $GITHUB_REF_NAME" --generate-notes Reflux-*
