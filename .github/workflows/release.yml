# Builds the Linux AppImage, the Windows setup and the macOS disk image. A `v*` tag also
# publishes them as a GitHub release, the feed `desktop::updater` reads (GitHub adds each asset's
# SHA-256). Pushes to master build too, so the dependency caches are warm when a tag comes (a tag
# run reads the default branch's caches): a release then compiles little more than reflux itself.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  REFLUX_UPDATE_FEED: https://api.github.com/repos/${{ github.repository }}/releases/latest

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The CJK/Arabic/Hebrew/Devanagari/Thai faces are gitignored; build them from Fluxer's.
      # shortcut: cached by the script's hash, so a Fluxer font update needs a script change (or cache delete) to land.
      - id: fonts
        uses: actions/cache@v4
        with:
          path: script-fonts
          key: script-fonts-${{ hashFiles('scripts/fonts-extract.py') }}
      - name: Script fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/fluxerapp/fluxer /tmp/fluxer
          git -C /tmp/fluxer sparse-checkout set packages/fonts/files
          pip install -q fonttools brotli
          mkdir -p script-fonts
          python3 scripts/fonts-extract.py /tmp/fluxer/packages/fonts/files script-fonts
      - uses: actions/upload-artifact@v4
        with:
          name: script-fonts
          path: script-fonts
          retention-days: 3

  linux:
    needs: version
    # GStreamer 1.24 (22.04's 1.20 has no pipewiresrc target-object). Needs glibc 2.39.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libudev-dev libdbus-1-dev libasound2-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pipewire libva-dev libdrm-dev libgbm-dev libx11-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxext-dev libwayland-dev libxkbcommon-dev file desktop-file-utils mold
          # libwebrtc's hermetic libc++ needs clang 21+; 24.04 ships 18.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
          # webrtc-sys builds NVENC only if $CUDA_HOME/include/cuda.h exists (libcuda is dlopened).
          pip install -q --target /tmp/cuda nvidia-cuda-runtime==13.0.96
          test -f /tmp/cuda/nvidia/cu13/include/cuda.h
          echo "CUDA_HOME=/tmp/cuda/nvidia/cu13" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # webrtc-sys's build script doesn't rerun on CUDA_HOME: a cache built without it keeps NVENC out.
          key: cuda13
      - run: cargo build --release --locked -p reflux
      - name: NVENC linked
        run: strings target/release/reflux | grep -q libcuda.so.1
      - uses: actions/download-artifact@v4
        with:
          name: script-fonts
          path: assets/fonts
      - run: sh packaging/linux/appimage.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Reflux-*.AppImage
          retention-days: 3

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      # Defender scans every object and rlib the build writes.
      - run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release --locked -p reflux
      - uses: actions/download-artifact@v4
        with:
          name: script-fonts
          path: assets/fonts
      - name: Setup
        shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp target/release/reflux.exe dist/
          cp -R assets/fonts dist/fonts
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis || choco install nsis -y
          makensis -DVERSION=$v -DSRC="$(cygpath -w "$PWD/dist")" -DOUT="$(cygpath -w "$PWD/Reflux-$v-x86_64-setup.exe")" packaging/windows/reflux.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Reflux-*-setup.exe
          retention-days: 3

  macos:
    needs: version
    # Apple silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release --locked -p reflux
      - uses: actions/download-artifact@v4
        with:
          name: script-fonts
          path: assets/fonts
      - run: sh packaging/macos/bundle.sh ${{ needs.version.outputs.version }} Reflux-${{ needs.version.outputs.version }}-aarch64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Reflux-*.dmg
          retention-days: 3

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Reflux $GITHUB_REF_NAME" --generate-notes Reflux-*
